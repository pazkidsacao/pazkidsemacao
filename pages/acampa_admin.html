<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administração Acampa Paz</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="stylesheet"
        href="../css/acampa_admin.css"
    >

</head>


<body>


    <!-- ======================================================
         CONTAINER PRINCIPAL
    ====================================================== -->

    <main class="pagina-admin">

        <div class="container-admin">


            <!-- ==================================================
                 CABEÇALHO
            ================================================== -->

            <header class="cabecalho-admin">

                <div>

                    <h1>
                        Administração Acampa Paz
                    </h1>

                    <p>
                        Controle dos apadrinhamentos do Acampa Kids
                    </p>

                </div>

            </header>


            <!-- ==================================================
                 RESUMO
            ================================================== -->

            <section class="resumo">


                <div class="card-resumo">

                    <span class="icone-resumo">
                        📋
                    </span>

                    <div>

                        <h2>
                            Total
                        </h2>

                        <strong id="total">
                            0
                        </strong>

                    </div>

                </div>


                <div class="card-resumo pendente">

                    <span class="icone-resumo">
                        ⏳
                    </span>

                    <div>

                        <h2>
                            Pendentes
                        </h2>

                        <strong id="pendentes">
                            0
                        </strong>

                    </div>

                </div>


                <div class="card-resumo pago">

                    <span class="icone-resumo">
                        ✓
                    </span>

                    <div>

                        <h2>
                            Pagos
                        </h2>

                        <strong id="pagos">
                            0
                        </strong>

                    </div>

                </div>


                <div class="card-resumo valor">

                    <span class="icone-resumo">
                        💰
                    </span>

                    <div>

                        <h2>
                            Arrecadado
                        </h2>

                        <strong id="valor">
                            R$ 0,00
                        </strong>

                    </div>

                </div>


            </section>


            <!-- ==================================================
                 PESQUISA
            ================================================== -->

            <section class="area-pesquisa">

                <input
                    id="pesquisa"
                    type="text"
                    placeholder="Pesquisar por nome, telefone, e-mail ou campus..."
                    autocomplete="off"
                >

            </section>


            <!-- ==================================================
                 TABELA
            ================================================== -->

            <section class="area-tabela">

                <div class="tabela-container">

                    <table>

                        <thead>

                            <tr>

                                <th>
                                    ID
                                </th>

                                <th>
                                    Data
                                </th>

                                <th>
                                    Padrinho
                                </th>

                                <th>
                                    Telefone
                                </th>

                                <th>
                                    E-mail
                                </th>

                                <th>
                                    Campus
                                </th>

                                <th>
                                    ID Criança
                                </th>

                                <th>
                                    Status
                                </th>

                                <th>
                                    Ação
                                </th>

                            </tr>

                        </thead>


                        <tbody id="tabela">

                            <!--
                                Os registros serão inseridos
                                pelo JavaScript.
                            -->

                        </tbody>

                    </table>

                </div>

            </section>


        </div>

    </main>


    <!-- ======================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="../js/acampa_admin.js">
    </script>


</body>

</html>
